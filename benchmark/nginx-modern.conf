# New-protocol upstream: round-robin, stateless, Redis-backed.
# No sessions — every instance handles every request.
upstream modern_servers {
    server new_1:8000;
    server new_2:8000;
    server new_3:8000;
}

server {
    listen 80;
    location /mcp {
        proxy_pass http://modern_servers;
        proxy_set_header Host                  $host;
        proxy_set_header X-Real-IP             $remote_addr;
        proxy_set_header MCP-Protocol-Version  $http_mcp_protocol_version;
        proxy_set_header Mcp-Method            $http_mcp_method;
        proxy_set_header Mcp-Name              $http_mcp_name;
    }
}
