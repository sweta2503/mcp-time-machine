# Old-protocol upstream: plain round-robin, no sticky sessions.
# Sessions are per-instance in-memory → cross-instance requests fail.
upstream legacy_servers {
    server old_1:8000;
    server old_2:8000;
    server old_3:8000;
}

server {
    listen 80;
    location /mcp {
        proxy_pass http://legacy_servers;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
