# Branch: 02-break-it
# Two server instances + nginx round-robin (NO sticky sessions).
# Session store is per-instance in memory.
# Mid-session requests that land on the wrong instance get:
#   {"error":{"code":-32600,"message":"Session not found: <id>"}}
#
# Run:  docker-compose up --build --scale server=2   (or just up — replicas set below)
# Then: python ../client/old_client.py
version: "3.9"

services:
  server_1:
    build: .
    environment:
      PORT: "8000"

  server_2:
    build: .
    environment:
      PORT: "8000"

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ../infra/nginx-2instance.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - server_1
      - server_2
