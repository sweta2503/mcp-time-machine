# Branch: 11-redis-tasks
# Redis-backed task store + three server instances + nginx.
#
# Key demo sequence:
#   1. docker compose up --build
#   2. python ../client/new_client.py          ← task completes, shows task_id
#   3. docker compose restart server_1 server_2 server_3
#   4. Script retrieves same task_id from Redis → result still there
#   5. Cancel demo: start task, tasks/cancel, verify status=cancelled
version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  server_1:
    build: .
    environment:
      PORT: "8000"
      INSTANCE: "server_1"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      - redis

  server_2:
    build: .
    environment:
      PORT: "8000"
      INSTANCE: "server_2"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      - redis

  server_3:
    build: .
    environment:
      PORT: "8000"
      INSTANCE: "server_3"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      - redis

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ../infra/nginx-simple.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - server_1
      - server_2
      - server_3
