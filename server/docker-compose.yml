# Branch: 05-stateless-scale
# Three server instances + nginx round-robin.
# No session store → every instance can handle every request.
# Kill any instance mid-demo: remaining calls still succeed.
#
# Demo sequence:
#   1. docker-compose up --build
#   2. python ../client/new_client.py
#   3. docker-compose stop server_2   (mid-demo)
#   4. client continues uninterrupted
version: "3.9"

services:
  server_1:
    build: .
    environment:
      PORT: "8000"
      INSTANCE: "server_1"

  server_2:
    build: .
    environment:
      PORT: "8000"
      INSTANCE: "server_2"

  server_3:
    build: .
    environment:
      PORT: "8000"
      INSTANCE: "server_3"

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ../infra/nginx-roundrobin.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - server_1
      - server_2
      - server_3
