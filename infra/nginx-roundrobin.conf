# Branch 09-headers: route and authorize on Mcp-Method / Mcp-Name headers.
# No JSON body parsing needed — all routing intelligence is in the headers.
#
# Rules demonstrated on camera:
#   • deep_scan_account_history → routed to heavy_servers (larger instances)
#   • flag_account              → requires X-Analyst-Token header (toy auth)
#   • everything else           → fraud_servers (round-robin)

upstream fraud_servers {
    server server_1:8000;
    server server_2:8000;
    server server_3:8000;
}

# In a real deployment, heavy_servers would be instances with more CPU/memory.
# Here they alias the same pool to keep docker-compose simple.
upstream heavy_servers {
    server server_1:8000;
    server server_2:8000;
    server server_3:8000;
}

# Route long-running scans to dedicated upstream without parsing JSON body
map $http_mcp_name $target_upstream {
    "deep_scan_account_history"  "heavy";
    default                      "standard";
}

server {
    listen 80;

    # ── flag_account: require analyst token ───────────────────────────────
    location /mcp {
        # Toy auth: flag_account requires X-Analyst-Token
        set $auth_fail "";
        if ($http_mcp_name = "flag_account") {
            set $auth_fail "check";
        }
        if ($http_x_analyst_token = "") {
            set $auth_fail "${auth_fail}_missing";
        }
        if ($auth_fail = "check_missing") {
            return 403 '{"jsonrpc":"2.0","id":null,"error":{"code":-32600,"message":"flag_account requires X-Analyst-Token header"}}';
        }

        # Route based on Mcp-Name (no JSON parse)
        if ($target_upstream = "heavy") {
            proxy_pass http://heavy_servers;
            break;
        }

        proxy_pass http://fraud_servers;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Mcp-Method        $http_mcp_method;
        proxy_set_header Mcp-Name          $http_mcp_name;
        proxy_set_header MCP-Protocol-Version $http_mcp_protocol_version;
    }
}
