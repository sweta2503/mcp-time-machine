# Branch 02-break-it: plain round-robin, no sticky sessions
# Branch 09-headers:  adds Mcp-Method / Mcp-Name routing rules

upstream fraud_servers {
    # Round-robin — default, no ip_hash, no sticky
    server server_1:8000;
    server server_2:8000;
    server server_3:8000;
}

# ── Branch 09-headers: method/name-based routing maps ─────────────────────
# Uncomment in branch 09 to demo header-based routing without JSON parsing.
#
# map $http_mcp_name $upstream_pool {
#     "deep_scan_account_history"  heavy_servers;
#     default                      fraud_servers;
# }
#
# map $http_mcp_method $auth_required {
#     "tools/call"  "yes";
#     default       "no";
# }

server {
    listen 80;

    # ── Branch 09: toy auth on Mcp-Name ────────────────────────────────────
    # Uncomment in branch 09.
    #
    # location /mcp {
    #     if ($http_mcp_name = "flag_account") {
    #         set $auth_check $http_x_analyst_token;
    #         if ($auth_check = "") {
    #             return 403 '{"error":"flag_account requires X-Analyst-Token header"}';
    #         }
    #     }
    #     proxy_pass http://fraud_servers;
    #     proxy_set_header Host $host;
    # }

    location /mcp {
        proxy_pass http://fraud_servers;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Mcp-Session-Id    $http_mcp_session_id;
        proxy_set_header Mcp-Method        $http_mcp_method;
        proxy_set_header Mcp-Name          $http_mcp_name;
    }
}
