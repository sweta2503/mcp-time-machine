# Simple round-robin with no auth gate.
# Used by branches 11-redis-tasks and 12-benchmark (new-protocol side).
upstream mcp_servers {
    server server_1:8000;
    server server_2:8000;
    server server_3:8000;
}

server {
    listen 80;

    location /mcp {
        proxy_pass http://mcp_servers;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header MCP-Protocol-Version $http_mcp_protocol_version;
        proxy_set_header Mcp-Method        $http_mcp_method;
        proxy_set_header Mcp-Name          $http_mcp_name;
    }
}
